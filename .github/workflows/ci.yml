name: CI

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

jobs:
  backend:
    name: Backend tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install backend dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"

      - name: Compile backend
        run: python -m compileall -q src/backend/supportagent

      - name: Run backend tests
        env:
          CHAT_MODEL: qwen-plus
          CHAT_MODELS: qwen-plus,qwen-max,qwen3-max
          EMBEDDING_API_KEY: ci-placeholder
          EMBEDDING_BASE_URL: https://example.invalid/v1
          DATABASE_URL: postgresql://supportagent:supportagent@localhost:5432/supportagent
          MCP_DYNAMIC_TOOLS_ENABLED: "false"
        run: python -m pytest

      - name: Run offline claim evaluation
        run: |
          python -m supportagent.evaluation \
            --suite claim-review \
            --output artifacts/evals/claim-review-ci.json

      - name: Upload evaluation report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: claim-review-evaluation
          path: artifacts/evals/claim-review-ci.json
          if-no-files-found: warn

  frontend:
    name: Frontend build
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: src/frontend

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"
          cache-dependency-path: src/frontend/package-lock.json

      - name: Install frontend dependencies
        run: npm ci

      - name: Typecheck frontend
        run: npm run typecheck

      - name: Build frontend
        run: npm run build

  docker:
    name: Docker image build check
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    needs: [backend, frontend]

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build backend image
        run: docker build -f Dockerfile.backend -t supportagent-backend:ci .

      - name: Build frontend image
        run: docker build -f src/frontend/Dockerfile -t supportagent-frontend:ci src/frontend

  publish-backend-image:
    name: Publish backend image
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    needs: [backend, frontend]
    environment: azure-dev

    permissions:
      contents: read
      id-token: write

    env:
      AZURE_CONTAINER_REGISTRY: acrsupportagentdev
      IMAGE_REPOSITORY: supportagent-api

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Log in to Azure with OIDC
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Define immutable image URI
        id: image
        shell: bash
        run: |
          ACR_LOGIN_SERVER="$(az acr show \
            --name "$AZURE_CONTAINER_REGISTRY" \
            --query loginServer \
            --output tsv)"

          IMAGE_URI="${ACR_LOGIN_SERVER}/${IMAGE_REPOSITORY}:${GITHUB_SHA}"
          echo "image_uri=${IMAGE_URI}" >> "$GITHUB_OUTPUT"
          echo "Publishing ${IMAGE_URI}"

      - name: Log Docker in to ACR
        run: az acr login --name "$AZURE_CONTAINER_REGISTRY"

      - name: Build and push backend image
        run: |
          docker buildx build \
            --platform linux/amd64 \
            --file Dockerfile.backend \
            --tag "${{ steps.image.outputs.image_uri }}" \
            --push \
            .
