name: Azure OIDC Check

on:
  workflow_dispatch:

permissions:
  id-token: write
  contents: read

env:
  AZURE_RESOURCE_GROUP: rg-supportagent-dev
  AZURE_CONTAINER_APP: ca-supportagent-api-dev

jobs:
  verify-azure-identity:
    name: Verify Azure identity
    runs-on: ubuntu-latest
    environment: azure-dev

    steps:
      - name: Log in to Azure with OIDC
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Show selected Azure subscription
        run: |
          az account show \
            --query '{Subscription:name,SubscriptionId:id,TenantId:tenantId}' \
            --output table

      - name: Verify Container App access
        run: |
          az resource show \
            --resource-group "$AZURE_RESOURCE_GROUP" \
            --name "$AZURE_CONTAINER_APP" \
            --resource-type Microsoft.App/containerApps \
            --query '{Name:name,Location:location,ProvisioningState:properties.provisioningState}' \
            --output table