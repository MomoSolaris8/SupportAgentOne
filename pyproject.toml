[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "supportagent"
version = "0.1.0"
requires-python = ">=3.10"
dependencies = [
    "pypdf",
    "openai",
    "anthropic",
    "psycopg[binary]",
    "python-dotenv",
    "pgvector",
    "fastapi",
    "uvicorn",
    "requests",
    "python-multipart",
    "langfuse",
    "langgraph",
    "mcp",
    "langchain",
    "langchain-openai",
    "langchain-anthropic",
    "boto3",
    "boto3-stubs~=1.43.54",
]

[project.optional-dependencies]
dev = ["pytest"]

[tool.setuptools.packages.find]
where = ["src/backend"]
include = ["supportagent*"]

[tool.setuptools.package-dir]
"" = "src/backend"

[tool.vercel]
entrypoint = "supportagent.api:app"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = [
  "--strict-config",
  "--strict-markers",
  "-ra",
]
markers = [
  "unit: isolated deterministic tests without external infrastructure",
  "component: in-process tests across multiple application modules",
  "integration: tests against real infrastructure such as databases or storage",
  "eval: AI quality evaluations based on datasets and scoring rules",
  "live: tests that call real external AI providers and may incur cost",
  "e2e: end-to-end tests against a deployed application",
]
