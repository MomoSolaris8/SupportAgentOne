      - tariff: Komfort
        value: 6 Monate
      - tariff: Premium
        value: 12 Monate
    questions:
      - "Wie lange gilt die Aussenversicherung der {subject} im Tarif {tariff}?"

  - id: hausrat.elementar.ueberschwemmung
    subject: hausrat
    topic: Elementargefahren
    attribute: Absicherung von Ueberschwemmung und Rueckstau
