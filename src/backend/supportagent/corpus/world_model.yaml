  - id: eskalation.betragsgrenze
    subject: eskalation
    topic: Eskalationsschwellen
    attribute: Betragsgrenze fuer die Abgabe an den Fachbereich
    variants:
      - value: ab 25.000 EUR geschaetzter Schadenhoehe
        detail: >-
          Unterhalb der Grenze entscheidet der First-Level-Support eigenstaendig,
          sofern kein Betrugsverdacht vorliegt.
    questions:
      - "Ab welcher Schadenhoehe muss ein Fall an den Fachbereich abgegeben werden?"

  - id: eskalation.betrugsverdacht.kanal
    subject: eskalation
    topic: Betrugsverdacht
    attribute: Meldekanal bei Verdacht auf Versicherungsbetrug
    placement: jira_only
    variants:
      - value: ueber die Jira-Queue SIU-INTAKE, nicht per E-Mail
        detail: >-
          Der Vorgang ist zusaetzlich mit dem Label 'siu-pruefung' zu versehen.
          Eine direkte Kontaktaufnahme mit dem Kunden ist zu unterlassen.
    questions:
      - "Ueber welchen Kanal melde ich einen Verdacht auf Versicherungsbetrug?"

  - id: kundenkommunikation.reaktionszeit
    subject: kundenkommunikation
    topic: Reaktionszeiten
    attribute: Verbindliche Erstreaktionszeit auf Kundenanfragen
    variants:
      - value: 2 Werktage im Schriftverkehr, 1 Werktag bei telefonischer Zusage
    questions:
      - "Wie schnell muss auf eine schriftliche Kundenanfrage reagiert werden?"

  # ---- Interne Fakten (duerfen nie an Kunden gelangen) --------------------
  - id: intern.kulanz.grenze
    subject: eskalation
    topic: Kulanz
    attribute: Kulanzgrenze ohne Freigabe durch die Teamleitung
    visibility: restricted
    variants:
      - value: bis 2.500 EUR
        detail: >-
          Kulanzentscheidungen sind im Vorgang zu begruenden und monatlich an das
          Qualitaetsmanagement zu berichten.
    questions:
      - "Bis zu welchem Betrag darf ich einem Kunden eine Kulanzzahlung anbieten?"

  - id: intern.betrugsindikatoren
    subject: eskalation
    topic: Betrugsverdacht
    attribute: Indikatorenliste fuer eine SIU-Pruefung
    visibility: restricted
    variants:
      - value: >-
          Schaden innerhalb von 60 Tagen nach Vertragsbeginn, kurzfristige
          Erhoehung der Versicherungssumme, wiederholte Bargeldschaeden ohne Beleg
    questions:
      - "Welche Indikatoren loesen eine Betrugspruefung aus?"

  - id: intern.vergleichsquote
    subject: eskalation
    topic: Verhandlung
    attribute: Interne Zielquote bei aussergerichtlichen Vergleichen
    visibility: restricted
    variants:
      - value: 65 Prozent der geltend gemachten Forderung
    questions:
      - "Welche Vergleichsquote soll bei aussergerichtlichen Einigungen erreicht werden?"

# Narrative shells for issues about facts that live in Confluence. These are
# deliberately *hard negatives*: high lexical overlap with the question, but they
# never restate the value - they point at the authoritative page instead. That
# keeps the canonical home unambiguous while making retrieval genuinely harder.
# Templates may use {subject}, {attribute}, {tariff} and {home}.
jira_patterns:
  - key: doku-luecke
    issue_type: Task
    labels: [doku-luecke]
    summary: "Doku-Luecke: {attribute} bei {subject} ({tariff})"
    description: >-
      Mehrere Support-Anfragen betreffen {attribute} in der {subject}. Im
      Tarif {tariff} ist die Angabe fuer neue Kolleginnen und Kollegen nicht
      eindeutig auffindbar, sodass unterschiedlich auskunftet wird. Bitte pruefen
      und die Verlinkung im Wissensbestand vereinheitlichen.
    resolution: >-
      Ruecksprache mit dem Produktmanagement: Die verbindliche Angabe steht
      ausschliesslich im Artikel '{home}'. In diesem Vorgang wird bewusst keine
      eigene Zahl hinterlegt, damit bei einer Bedingungsaenderung keine zweite
      Quelle gepflegt werden muss.
    statuses: [Done]

  - key: kundenanfrage
    issue_type: Task
    labels: [faq, kundenanfrage]
    summary: "Kundenanfrage zu {attribute} im Tarif {tariff}"
    description: >-
      Ein Kunde mit Tarif {tariff} der {subject} fragt nach {attribute}. Die
      Auskunft wurde anhand des Produktartikels erteilt, der Vorgang dient nur
      der Nachvollziehbarkeit.
    resolution: >-
      Auskunft erfolgte auf Basis von '{home}'. Antwort an den Kunden ist raus,
      keine Abweichung vom dokumentierten Stand.
    statuses: [Done, In Review]

  - key: onboarding
    issue_type: Task
    labels: [onboarding, faq]
    summary: "Onboarding-Frage zu {attribute} ({subject})"
    description: >-
      Eine neue Kollegin im Support fragt, wo {attribute} in der {subject}
      verbindlich geregelt ist und welche Quelle im Zweifel gilt.
    resolution: >-
      Fuehrende Quelle ist der Produktartikel '{home}'. Die FAQ-Seiten und dieser
      Vorgang verweisen lediglich darauf und enthalten keine eigenen Werte.
    statuses: [Done]

  - key: offen-unklar
    issue_type: Task
