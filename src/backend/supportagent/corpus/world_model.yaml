# World model for the synthetic German insurance knowledge base.
#
# Fictional content written for this project; not copied from any real insurer.
# Umlauts are transliterated (ae/oe/ue/ss) to match the existing seed content.
#
# Every fact below becomes (a) a statement on exactly one canonical page or Jira
# comment and (b) one or more gold evaluation cases. Difficulty comes from the
# structure, not from the volume:
#   - tariff variants     -> near-identical distractor pages
#   - superseded editions -> a plausible but outdated answer stays retrievable
#   - placement jira_only -> the answer exists only in a Jira resolution
#   - visibility restricted -> must never reach an unprivileged asker
#   - out_of_scope        -> must be refused

insurer:
  name: Meridian Versicherung AG
  locale: de-DE
  kb_label: insurance-kb

sections:
  - key: privatkunden
    title: Privatkundenprodukte
    body: >-
      <p>Produktdokumentation fuer die privaten Versicherungsprodukte der Meridian
      Versicherung AG. Verbindlich sind die jeweils gueltigen Versicherungsbedingungen.</p>
  - key: kfz
    title: Kfz-Versicherung
    body: >-
      <p>Produkt- und Schadeninformationen rund um Kfz-Versicherungen.</p>
  - key: schadenbearbeitung
    title: Schadenbearbeitung
    body: >-
      <p>Prozesse rund um Schadenmeldung, Bearbeitung und Eskalation, uebergreifend
      fuer alle Versicherungsprodukte.</p>
  - key: archiv
    title: Archiv - Abgeloeste Bedingungswerke
    body: >-
      <p>Historische Bedingungswerke. Diese Seiten sind nicht mehr gueltig und dienen
      ausschliesslich der Nachvollziehbarkeit von Altvertraegen.</p>
  - key: intern
    title: Intern - Nur Fachbereich
    body: >-
      <p>Interne Arbeitsanweisungen. Nicht fuer die Kundenkommunikation bestimmt.</p>
    restricted: true

products:
  - key: hausrat
    section: privatkunden
    name: Hausratversicherung
    summary: >-
      Absicherung des gesamten Hausrats gegen Feuer, Einbruchdiebstahl,
      Leitungswasser sowie Sturm und Hagel.
    tariffs: [Basis, Komfort, Premium]

  - key: haftpflicht
    section: privatkunden
    name: Private Haftpflichtversicherung
    summary: >-
      Schutz vor Schadenersatzanspruechen Dritter bei Personen-, Sach- und
      Vermoegensschaeden.
    tariffs: [Basis, Komfort, Premium]

  - key: rechtsschutz
    section: privatkunden
    name: Rechtsschutzversicherung
    summary: >-
      Uebernahme von Anwalts-, Gerichts- und Sachverstaendigenkosten in den
      versicherten Rechtsbereichen.
    tariffs: [Basis, Premium]

  - key: wohngebaeude
    section: privatkunden
    name: Wohngebaeudeversicherung
    summary: >-
      Absicherung des Gebaeudes selbst gegen Feuer, Leitungswasser, Sturm und Hagel
      sowie optional Elementargefahren.
    tariffs: [Basis, Premium]

  - key: kfz
    section: kfz
    name: Kfz-Versicherung
    summary: >-
      Haftpflicht-, Teilkasko- und Vollkaskoschutz fuer Personenkraftwagen.
    tariffs: [Basis, Komfort, Premium]
    superseded:
      # The 2022 edition charged a deductible on glass damage in Komfort. The
      # current edition waives it. Both pages remain retrievable.
      - label: "2022-01"
        valid_from: 2022-01-01
        valid_to: 2023-12-31
        overrides:
          kfz.glasschaden.sb:
            Komfort: "150 EUR je Glasschaden"
          kfz.teilkasko.sb:
            Komfort: "500 EUR je Schadenfall"

processes:
  - key: schadenmeldung
    section: schadenbearbeitung
    name: Schadenmeldung
    summary: >-
      Ablauf von der Erstmeldung bis zur Vollstaendigkeitspruefung der Unterlagen.
  - key: eskalation
    section: schadenbearbeitung
    name: Eskalationsprozesse
    summary: >-
      Wann ein Schadenfall den First-Level-Support verlaesst und an einen
      Fachbereich uebergeben wird.
  - key: kundenkommunikation
    section: schadenbearbeitung
    name: Kundenkommunikation
    summary: >-
      Verbindliche Reaktionszeiten und Kanaele im Kundenkontakt.

facts:
  # ---- Hausrat ------------------------------------------------------------
  - id: hausrat.fahrraddiebstahl.aussen
    subject: hausrat
    topic: Fahrraddiebstahl
    attribute: Entschaedigung bei Fahrraddiebstahl ausserhalb der Wohnung
    variants:
      - tariff: Basis
        value: nicht versichert
        detail: >-
          Versichert ist ausschliesslich der Diebstahl aus der Wohnung, dem Keller
          oder einer abgeschlossenen Garage, sofern Einbruchspuren vorliegen.
      - tariff: Komfort
        value: bis 1.000 EUR
        detail: >-
          Voraussetzung ist ein verkehrsueblich abgeschlossenes Schloss; der
          Kaufbeleg des Schlosses ist auf Verlangen vorzulegen.
      - tariff: Premium
        value: bis 5.000 EUR
        detail: >-
          Eingeschlossen sind auch E-Bikes bis 25 km/h ohne gesonderte Anmeldung.
    questions:
      - "Ist mein Fahrrad im Tarif {tariff} versichert, wenn es vor dem Supermarkt gestohlen wird?"
      - "Wie hoch ist die Entschaedigung bei Fahrraddiebstahl auf der Strasse im {subject}-Tarif {tariff}?"

  - id: hausrat.wertsachen.grenze
    subject: hausrat
    topic: Wertsachen
    attribute: Entschaedigungsgrenze fuer Wertsachen
    variants:
      - tariff: Basis
        value: 20 Prozent der Versicherungssumme
      - tariff: Komfort
        value: 30 Prozent der Versicherungssumme
      - tariff: Premium
        value: 50 Prozent der Versicherungssumme
    questions:
      - "Bis zu welchem Anteil der Versicherungssumme sind Wertsachen im Tarif {tariff} der {subject} entschaedigt?"

  - id: hausrat.sb.standard
    subject: hausrat
    topic: Selbstbeteiligung
    attribute: Selbstbeteiligung je Schadenfall
    variants:
      - tariff: Basis
        value: 150 EUR
      - tariff: Komfort
        value: 150 EUR
      - tariff: Premium
        value: 0 EUR
    questions:
      - "Welche Selbstbeteiligung gilt in der {subject} im Tarif {tariff}?"

  - id: hausrat.grobe_fahrlaessigkeit
    subject: hausrat
    topic: Grobe Fahrlaessigkeit
    attribute: Leistung bei grober Fahrlaessigkeit
    variants:
