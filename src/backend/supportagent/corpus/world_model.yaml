        value: Kuerzung entsprechend der Schwere des Verschuldens
      - tariff: Komfort
        value: mitversichert bis 5.000 EUR
      - tariff: Premium
        value: in voller Hoehe mitversichert
    questions:
      - "Zahlt die {subject} im Tarif {tariff}, wenn ich den Schaden grob fahrlaessig verursacht habe?"

  - id: hausrat.aussenversicherung.dauer
    subject: hausrat
    topic: Aussenversicherung
    attribute: Dauer der Aussenversicherung bei voruebergehender Auslagerung
    variants:
